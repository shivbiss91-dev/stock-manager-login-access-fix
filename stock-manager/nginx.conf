# ==============================================================================
# StockVista Nginx Reverse Proxy Configuration
# ==============================================================================
# Instructions:
# 1. Copy this file to: /etc/nginx/sites-available/stockvista
# 2. Symlink: sudo ln -s /etc/nginx/sites-available/stockvista /etc/nginx/sites-enabled/
# 3. Test syntax: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your domain name or server IP address
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 50M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;

    # High-performance caching for hashed assets
    location /assets/ {
        proxy_pass http://127.0.0.1:3001/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy all API requests and SPA frontend to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
